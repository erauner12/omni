# cluster-template-home.yaml
kind: Cluster
name: erauner-home                       # Cluster name in Omni
talos:
  version: v1.11.5               # Upgraded for AMD GPU support (requires v1.11+)
kubernetes:
  version: 1.31.5                # latest patch in the supported minor
features:
  enableWorkloadProxy: true      # SaaS Omni feature – leave on
patches:
  - name: cluster-base
    file: ./patches/cluster.yaml   # relative path because repo will be synced
  - name: cilium-install-home
    file: ./patches/cilium-install-home.yaml
  - name: longhorn-install-home
    file: ./patches/longhorn-install-home.yaml
  - name: longhorn-configure-home
    file: ./patches/longhorn-configure-home.yaml
  # Add cert patches here later if you decide to keep them

---
kind: ControlPlane
machines:
  - e58acc82-cc4c-d949-b369-bc3898683580   # Beelink CP
patches:
  - name: controlplane-base
    file: ./patches/controlplane.yaml
  - name: machine-hostdns         # comment out if you dropped the file
    file: ./patches/machine-hostdns.yaml
  - name: kubelet
    file: ./patches/machine-kubelet.yaml
  - name: kernel-storage
    file: ./patches/kernel-iscsi.yaml
  - name: machine-registries
    file: ./patches/machine-registries.yaml
  - name: spegel-containerd
    file: ./patches/spegel-containerd.yaml
  # 🛑 DO NOT inject the "bgp=enable" label here—only Workers run the BGP speaker!
  # ✅ Add control-plane taint to prevent regular workloads from scheduling here.
  # The 4-core Beelink is undersized compared to 16-core workers - keep it for
  # kube-apiserver, etcd, controller-manager, scheduler, and CNI only.
  # Added: 2026-01-21 after NodeSystemSaturation alert (load 14.5 on 4 cores)
  - name: controlplane-taint
    inline:
      machine:
        kubelet:
          extraArgs:
            register-with-taints: node-role.kubernetes.io/control-plane:NoSchedule
  - name: static-ip
    inline:
      machine:
        network:
          interfaces:
            - deviceSelector:          # ⬅️  change
                hardwareAddr: e8:ff:1e:dd:18:63   # CP MAC
              dhcp: false
              addresses: [192.168.1.193/24]    # << static for controlplane1
              routes:
                - network: 0.0.0.0/0
                  gateway: 192.168.1.1
          nameservers:
            - 192.168.1.1
        sysctls:
          net.ipv4.conf.all.rp_filter: "0"
          net.ipv4.conf.default.rp_filter: "0"
          net.ipv4.conf.enp1s0.rp_filter: "0"
          # net.ipv4.conf.cilium_host.rp_filter: "0"
  - name: service-account-discovery-home
    file: ./patches/service-account-discovery-home.yaml
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
  - siderolabs/btrfs
---
kind: Workers
name: workers
machines:
  - 30467aa4-b8a4-2e43-8591-a8595f97a43c   # worker-1 (offline right now)
  - d3945f76-fb6b-c244-9ca3-a8595f9b4f7e   # worker-2 (offline)
patches:
  - name: worker-base
    file: ./patches/worker.yaml
  - name: machine-hostdns         # comment out if you dropped it
    file: ./patches/machine-hostdns.yaml
  - name: kubelet
    file: ./patches/machine-kubelet.yaml
  - name: kernel-storage
    file: ./patches/kernel-iscsi.yaml
  - name: kernel-amdgpu
    file: ./patches/kernel-amdgpu.yaml
  - name: machine-registries
    file: ./patches/machine-registries.yaml
  - name: spegel-containerd
    file: ./patches/spegel-containerd.yaml
  # ✅ Correct: inject the "bgp=enable" node label only on worker nodes (eligible for BGP speaking).
  - name: node-labels
    inline:
      machine:
        kubelet:
          extraArgs:
            "node-labels": "bgp=enable"
        nodeLabels:
          amd.com/gpu: "true"
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
  - siderolabs/btrfs
  # AMD GPU support for hardware transcoding (Plex)
  - siderolabs/amdgpu
  - siderolabs/amd-ucode

---
# worker2 is intentionally isolated from the shared worker machine set.
#
# Incident 2026-07-12: this node repeatedly hard-froze shortly after the
# siderolabs/amdgpu extension initialized. A minimal Talos image containing
# amd-ucode and realtek-firmware, but no amdgpu, remained stable and the node
# subsequently rejoined Kubernetes on the CPU-only schematic. Keep both the
# amdgpu extension and patches/kernel-amdgpu.yaml out of this machine set.
#
# The Realtek firmware is also intentional: both RTL8168h/8111h adapters logged
# missing rtl_nic/rtl8168h-2.fw without it. Re-enable GPU support only after
# MemTest, BIOS/thermal checks, and an isolated newer Talos/kernel test pass.
kind: Workers
name: worker2
machines:
  - 4913bb46-7cd8-2048-84c7-a8595f97a48c
patches:
  - name: worker-base
    file: ./patches/worker.yaml
  - name: machine-hostdns
    file: ./patches/machine-hostdns.yaml
  - name: kubelet
    file: ./patches/machine-kubelet.yaml
  - name: kernel-storage
    file: ./patches/kernel-iscsi.yaml
  - name: machine-registries
    file: ./patches/machine-registries.yaml
  - name: spegel-containerd
    file: ./patches/spegel-containerd.yaml
  - name: node-labels
    inline:
      machine:
        kubelet:
          extraArgs:
            "node-labels": "bgp=enable"
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
  - siderolabs/btrfs
  - siderolabs/amd-ucode
  - siderolabs/realtek-firmware

