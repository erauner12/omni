# Home control plane only. Issuer changes invalidate old projected SA tokens;
# follow docs/service-account-discovery.md before syncing this template.
cluster:
  apiServer:
    extraArgs:
      service-account-issuer: https://kubernetes.default.svc.cluster.local
      service-account-jwks-uri: https://kubernetes.default.svc.cluster.local/openid/v1/jwks
